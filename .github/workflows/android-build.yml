name: Android

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "crates/wallet-engine/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "crates/wallet-engine/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Scout Operator
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Rust 1.80 Android target
        uses: dtolnay/rust-toolchain@1.80.0
        with:
          targets: aarch64-linux-android

      - name: Locate Android NDK
        run: |
          NDK_DIR="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_DIR"
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          echo "SCOUT_ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build Rust Android bridge
        working-directory: android/native
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.SCOUT_ANDROID_NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang
          CC_aarch64_linux_android: ${{ env.SCOUT_ANDROID_NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang
          AR_aarch64_linux_android: ${{ env.SCOUT_ANDROID_NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo +1.80.0 build --target aarch64-linux-android

      - name: Package Rust bridge
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native/target/aarch64-linux-android/debug/libscout_operator_native.so \
            app/src/main/jniLibs/arm64-v8a/libscout_operator_native.so

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare named APK
        if: github.event_name != 'pull_request'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "app/build/outputs/apk/debug/scout-operator-v0.2.0-${SHORT_SHA}.apk"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: scout-operator-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish permanent Devnet APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APK="android/app/build/outputs/apk/debug/scout-operator-v0.2.0-${SHORT_SHA}.apk"

          if gh release view devnet-latest >/dev/null 2>&1; then
            gh release upload devnet-latest "$APK" --clobber
          else
            gh release create devnet-latest \
              "$APK" \
              --target "$GITHUB_SHA" \
              --title "Scout Operator — Devnet Latest" \
              --notes "Development-only Scout Operator APK. Devnet only. Mainnet and transaction submission remain disabled." \
              --prerelease
          fi
