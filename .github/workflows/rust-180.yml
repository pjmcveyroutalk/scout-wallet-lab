name: Rust 1.80

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Rust 1.80
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run security tripwires
        run: bash scripts/security-tripwires.sh

      - name: Install Rust 1.80.0
        uses: dtolnay/rust-toolchain@1.80.0
        with:
          components: rustfmt, clippy

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Emit dependency lockfile
        run: |
          echo "SCOUT_CARGO_LOCK_BEGIN"
          cat Cargo.lock
          echo "SCOUT_CARGO_LOCK_END"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Verify lockfile exists
        run: test -f Cargo.lock
