name: Rust 1.80

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    name: Bootstrap Cargo.lock
    runs-on: ubuntu-latest
    if: ${{ hashFiles('Cargo.lock') == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.80.0
        uses: dtolnay/rust-toolchain@1.80.0

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Lock Rust dependency graph"
          git push origin HEAD:main

  verify:
    name: Verify Rust 1.80
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run security tripwires
        run: bash scripts/security-tripwires.sh

      - name: Install Rust 1.80.0
        uses: dtolnay/rust-toolchain@1.80.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets
