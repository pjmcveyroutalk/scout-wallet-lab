name: Stage E Clippy Diagnostics

on:
  push:
    branches:
      - stage-e-devnet-simulation-preflight

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage-e-devnet-simulation-preflight

      - name: Install Rust 1.80.0
        uses: dtolnay/rust-toolchain@1.80.0
        with:
          components: rustfmt, clippy

      - name: Capture Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets -- -D warnings > stage-e-clippy-output.txt 2>&1
          status=$?
          printf '\nCLIPPY_EXIT_STATUS=%s\n' "$status" >> stage-e-clippy-output.txt
          exit 0

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage-e-clippy-output.txt
          git commit -m "Capture Stage E Clippy diagnostics"
          git push origin HEAD:stage-e-devnet-simulation-preflight
