name: Stage E Rustfmt Autofix

on:
  push:
    branches:
      - stage-e-devnet-simulation-preflight

permissions:
  contents: write

jobs:
  format:
    name: Apply exact Rust 1.80 formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage-e-devnet-simulation-preflight

      - name: Install Rust 1.80.0
        uses: dtolnay/rust-toolchain@1.80.0
        with:
          components: rustfmt

      - name: Apply formatting
        run: cargo fmt --all

      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply exact Rust 1.80 formatter output"
          git push origin HEAD:stage-e-devnet-simulation-preflight
