name: Stage E Test Fixture Fix

on:
  push:
    branches:
      - stage-e-devnet-simulation-preflight

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage-e-devnet-simulation-preflight

      - name: Install Rust 1.80.0
        uses: dtolnay/rust-toolchain@1.80.0
        with:
          components: rustfmt, clippy

      - name: Replace panic-based test fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/wallet-engine/src/stage_e_preflight.rs")
          text = path.read_text()
          marker = "#[cfg(test)]\nmod tests {"
          if marker not in text:
              raise SystemExit("Stage E test module marker not found")
          prefix = text.split(marker, 1)[0]
          tests = r'''#[cfg(test)]
          mod tests {
              use super::{
                  encode_single_signature_transaction, parse_fee_response, parse_simulation_response,
                  stage_e_preflight_instruction, validate_fee, GetFeeForMessageResponse,
                  GetFeeForMessageResult, SimulateTransactionResponse, SimulateTransactionResult,
                  SimulationContext, SimulationValue, StageEPreflightError, STAGE_E_MAX_FEE_LAMPORTS,
                  STAGE_E_PREFLIGHT_PAYLOAD, STAGE_E_PREFLIGHT_PROGRAM_ID,
              };

              #[test]
              fn stage_e_instruction_is_fixed_and_has_no_accounts() -> Result<(), StageEPreflightError> {
                  let instruction = stage_e_preflight_instruction()?;

                  assert_eq!(instruction.program_id.to_string(), STAGE_E_PREFLIGHT_PROGRAM_ID);
                  assert_eq!(instruction.data, STAGE_E_PREFLIGHT_PAYLOAD);
                  assert!(instruction.accounts.is_empty());
                  Ok(())
              }

              #[test]
              fn fee_boundary_rejects_zero_and_over_cap() {
                  assert!(matches!(
                      validate_fee(0),
                      Err(StageEPreflightError::FeeOutsideBoundary)
                  ));
                  assert!(validate_fee(STAGE_E_MAX_FEE_LAMPORTS).is_ok());
                  assert!(matches!(
                      validate_fee(STAGE_E_MAX_FEE_LAMPORTS + 1),
                      Err(StageEPreflightError::FeeOutsideBoundary)
                  ));
              }

              #[test]
              fn wire_encoding_is_one_signature_followed_by_message() {
                  let signature = [0x5a_u8; 64];
                  let message = [0x31_u8, 0x32_u8, 0x33_u8];
                  let encoded = encode_single_signature_transaction(signature, &message);

                  assert_eq!(encoded[0], 1_u8);
                  assert_eq!(&encoded[1..65], &signature);
                  assert_eq!(&encoded[65..], &message);
              }

              #[test]
              fn fee_response_requires_value() {
                  let valid = GetFeeForMessageResponse {
                      result: Some(GetFeeForMessageResult { value: Some(5_000) }),
                      error: None,
                  };
                  assert_eq!(parse_fee_response(valid), Ok(5_000));

                  let missing = GetFeeForMessageResponse {
                      result: Some(GetFeeForMessageResult { value: None }),
                      error: None,
                  };
                  assert_eq!(
                      parse_fee_response(missing),
                      Err(StageEPreflightError::InvalidResponse)
                  );
              }

              #[test]
              fn simulation_response_requires_clean_execution_and_units() {
                  let valid = SimulateTransactionResponse {
                      result: Some(SimulateTransactionResult {
                          context: SimulationContext { slot: 123 },
                          value: SimulationValue {
                              err: None,
                              units_consumed: Some(456),
                          },
                      }),
                      error: None,
                  };
                  assert_eq!(parse_simulation_response(valid), Ok((123, 456)));

                  let rejected = SimulateTransactionResponse {
                      result: Some(SimulateTransactionResult {
                          context: SimulationContext { slot: 123 },
                          value: SimulationValue {
                              err: Some(serde_json::Value::Bool(true)),
                              units_consumed: Some(456),
                          },
                      }),
                      error: None,
                  };
                  assert_eq!(
                      parse_simulation_response(rejected),
                      Err(StageEPreflightError::RpcRejected)
                  );
              }
          }
          '''
          path.write_text(prefix + tests)
          PY

      - name: Apply exact formatting
        run: cargo fmt --all

      - name: Verify Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Verify tests
        run: cargo test --locked --workspace --all-targets

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/wallet-engine/src/stage_e_preflight.rs
          git commit -m "Remove panic-based Stage E test fixtures"
          git push origin HEAD:stage-e-devnet-simulation-preflight
