[package]
name = "wallet-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "=0.5.3"
base64 = "=0.22.1"
base64ct = "=1.6.0"
bincode = "=1.3.3"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = { version = "=2.1.1", features = ["zeroize"] }
getrandom = "=0.2.15"
hyper-rustls = { version = "=0.27.7", default-features = false, features = ["http1", "tls12", "webpki-tokio"] }
idna_adapter = "=1.1.0"
reqwest = { version = "=0.12.18", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.137"
solana-hash = "=2.3.0"
solana-instruction = "=2.2.1"
solana-message = { version = "=2.2.1", features = ["serde"] }
solana-pubkey = { version = "=2.2.1", default-features = false, features = ["curve25519", "std"] }
zeroize = "=1.8.1"

[lints]
workspace = true
